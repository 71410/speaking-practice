name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-shell/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: android-shell/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Install shell dependencies
        working-directory: android-shell
        run: npm ci

      - name: Sync Capacitor Android project
        working-directory: android-shell
        run: npm run android:sync

      - name: Build debug APK
        working-directory: android-shell/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ielts-trainer-debug-apk
          path: android-shell/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create downloadable debug APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug-${{ github.sha }}
          name: Android Debug APK ${{ github.sha }}
          prerelease: true
          files: android-shell/android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            Debug APK for internal Android testing.

            This APK opens the hosted Streamlit app:
            https://speaking-practice-bhpcjdevjsrfpx99jckqpy.streamlit.app/
