# Claude 风格配色：暖白底 + 陶土色强调 + 低饱和中性色。
# 尽量走 Streamlit 原生主题而不是 CSS hack —— 原生配置能覆盖到侧边栏、
# 表单控件、图表等所有内部组件，且不会随 Streamlit 版本升级失效。

[theme]
base = "light"
font = "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
headingFont = "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
codeFont = "ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace"
baseFontSize = 15
baseRadius = "0.6rem"
buttonRadius = "0.5rem"
metricValueFontSize = "1.45rem"
metricValueFontWeight = 600
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.light]
primaryColor = "#C96442"              # Claude 陶土色
backgroundColor = "#FAF9F7"           # 暖白，不是纯白
secondaryBackgroundColor = "#F0EEE7"  # 卡片/输入框底色
textColor = "#1F1E1D"
borderColor = "#E3E0D8"
linkColor = "#C15F3C"
grayColor = "#8C8880"
grayTextColor = "#6B6862"
grayBackgroundColor = "#F0EEE7"
codeBackgroundColor = "#F0EEE7"
codeTextColor = "#8A4B32"
orangeColor = "#C96442"
orangeTextColor = "#8A4B32"

[theme.light.sidebar]
backgroundColor = "#F0EEE7"
secondaryBackgroundColor = "#E8E5DC"
borderColor = "#E3E0D8"
textColor = "#1F1E1D"
primaryColor = "#C96442"

[theme.dark]
primaryColor = "#D97757"
backgroundColor = "#262624"           # 暖调深色，不是纯黑
secondaryBackgroundColor = "#30302E"
textColor = "#F0EEE6"
borderColor = "#3E3E3C"
linkColor = "#E08966"
grayColor = "#8C8880"
grayTextColor = "#A8A49C"
grayBackgroundColor = "#30302E"
codeBackgroundColor = "#30302E"
codeTextColor = "#E0A183"

[theme.dark.sidebar]
backgroundColor = "#1F1E1D"
secondaryBackgroundColor = "#2C2C2A"
borderColor = "#3E3E3C"
textColor = "#F0EEE6"
primaryColor = "#D97757"

[server]
enableStaticServing = false

[browser]
gatherUsageStats = false
